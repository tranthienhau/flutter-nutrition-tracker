name: flutter_nutrition_tracker
description: A nutrition/calorie/macro tracking app with meal planning and barcode scanning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  uuid: ^4.2.1
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  path_provider: ^2.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
